name: healthcall_ai
description: "HealthCall AI - AI-Powered Healthcare Consultation & Appointment Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  uuid: any
  equatable: ^2.0.7
